[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-captchax"
version = "0.2.0"
description = "Pluggable CAPTCHA support for Django REST Framework."
authors = [
    { name = "Alireza Alibolandi", email = "alirezaalibolandi@duck.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["django", "django-rest-framework", "captcha", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.18,<3.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "build>=1.2",
    "redis>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/AlirezaAlibolandi/drf-captchax"
Documentation = "https://drf-captchax.readthedocs.io/"
Source = "https://github.com/AlirezaAlibolandi/drf-captchax"
Issues = "https://github.com/AlirezaAlibolandi/drf-captchax/issues"

[tool.setuptools.packages.find]
include = ["captchax*"]

[tool.setuptools.package-data]
captchax = ["static/fonts/*.ttf"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--cov=captchax --cov-report=term-missing -v"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
